<!-- TP5 1.7: 선택한 활동의 상세 정보 (상세 = 활동 제목) -->
<h3>Detail de l'activité:</h3>

<!-- 인덱스 0도 정상 처리되도록 truthy 검사가 아니라 undefined 여부로 분기 -->
@if (activite() !== undefined) {
  <ol>
    <li>Nom de l'activité: <strong>{{ activite() }}</strong></li>
  </ol>

  <!-- TP5 1.8: 현재 활동을 삭제하는 버튼 -->
  <button type="button" class="btn-supprimer" (click)="supprimeElem(index())">Supprimer</button>
} @else {
  <p>Activité introuvable.</p>
}
